spring.application.name=order-inventory-app

# Supabase Postgres connection.
# Values are provided through PowerShell environment variables.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Keep the application from opening too many Supabase connections.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=30000

# Tables are created/seeded manually via sql/schema.sql, not by Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=8080

# React (Vite) dev server origin allowed by CORS.
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Multi-item order below this remaining stock triggers a LowStock event
# after a successful reserve().
app.inventory.low-stock-threshold=5

# ---------------------------------------------------------------------
# Lab 3: LegacySupply integration (supplier module)
# Secrets come from environment variables - NEVER commit them:
#   LS_CLIENT_ID = your student id, LS_API_KEY = key from your instructor
# ---------------------------------------------------------------------
supplier.base-url=https://legacysupply.onrender.com/api/v1
supplier.client-id=${LS_CLIENT_ID:}
supplier.api-key=${LS_API_KEY:}

supplier.timeout-ms=3000
supplier.max-attempts=3
supplier.backoff-base-ms=400
supplier.session-max-age-seconds=0

supplier.pending-retry-ms=15000
supplier.pending-batch-size=5
supplier.tracking-interval-ms=30000
supplier.tracking-batch-size=10

app.reorder.target-stock=20
supplier.reorder.dedupe-open-orders=true

spring.task.scheduling.pool.size=2
