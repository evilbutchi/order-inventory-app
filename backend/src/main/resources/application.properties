spring.application.name=order-inventory-app

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=30000

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=8080

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

app.inventory.low-stock-threshold=5

supplier.base-url=https://legacysupply.onrender.com/api/v1
supplier.client-id=${LS_CLIENT_ID:}
supplier.api-key=${LS_API_KEY:}

supplier.timeout-ms=3000
supplier.max-attempts=3
supplier.backoff-base-ms=400
supplier.session-max-age-seconds=0

supplier.pending-retry-ms=15000
supplier.pending-batch-size=5
supplier.tracking-interval-ms=30000
supplier.tracking-batch-size=10

app.reorder.target-stock=20
supplier.reorder.dedupe-open-orders=true

spring.task.scheduling.pool.size=6

channel.base-url=${TIANGGE_BASE_URL:https://legacysupply.onrender.com/tiangge/v1}
channel.client-id=${LS_CLIENT_ID:}
channel.api-key=${LS_API_KEY:}

channel.timeout-ms=3000
channel.max-attempts=3
channel.backoff-base-ms=400

channel.heartbeat-interval-ms=30000
channel.feed-poll-ms=500
channel.feed-page-size=50
channel.flush-interval-ms=1000

channel.listings=P100:Wireless Mouse,P200:Mechanical Keyboard,P300:USB-C Hub