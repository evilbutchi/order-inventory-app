spring.application.name=order-inventory-app

# Supabase Postgres connection. Never hardcode real values here -
# these come from environment variables at runtime.
# See README for how to get these from your Supabase project
# (Project Settings -> Database -> Connection string, use the
# "Session pooler" or direct connection URI in JDBC form).
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Tables are created/seeded manually via sql/schema.sql, not by Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=8080

# React (Vite) dev server origin allowed by CORS.
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
